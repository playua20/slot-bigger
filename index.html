<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" >
        <meta name="viewport" content="width=device-width, initial-scale=1.0" >
        <title>Bigger Bass Splash</title>
        <link rel="canonical" href="https://www.domain.com/">
        <link rel="stylesheet" href="styles.min.css" >
    </head>
    <body>
        <h1>Bigger Bass Splash</h1>
        <main class="wrapper">
            <div id="preloader">
                <div class="preloader-wrapper">
                    <div class="loader">
                        <div class="loader-inner"></div>
                    </div>
                </div>
            </div>

            <div class="logo"></div>
            <div class="slots">
                <div class="slots-list animation-starter">
                    <div class="slots-group" data-group="0"></div>
                    <div class="slots-group" data-group="1"></div>
                    <div class="slots-group" data-group="2"></div>
                </div>
                <div class="slots-table-container">
                    <div class="slots-table">
                        <div class="text-front">
                            FREE SPINS: <span class="spins-counter">3</span>
                        </div>
                        <div class="text-back">
                            FREE SPINS: <span class="spins-counter">3</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="button-container light-button spin-button-container">
                <button class="button spin-button">
                    <div class="button-text-front">Spin</div>
                    <div class="button-text-back">Spin</div>
                </button>
            </div>

            <div class="overlay promo-overlay promo-overlay-show">
                <div class="promo-card card">
                    <div class="content-wrapper">
                        <div class="card-text-content">
                            <p class="wow-text">Wow!</p>
                            <p class="received-text">you received:</p>
                            <p class="spins-text">3 free spins</p>
                        </div>
                        <div class="no-reg-info">
                            <span class="check-icon no-reg-icon"></span>
                            <span class="no-reg-text"
                                >Without registration</span
                            >
                        </div>
                        <div
                            class="button-container light-button activate-button-container"
                        >
                            <button class="button activate-button">
                                <div class="button-text-front">Activate</div>
                                <div class="button-text-back">Activate</div>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="overlay offer-overlay">
                <div class="offer-card card">
                    <div class="content-wrapper">
                        <div class="card-text-content">
                            <p class="well-done-text">Well done!</p>
                            <p class="won-text">You done:</p>
                            <p class="prize-text">450 gpb</p>
                            <p class="spins-prize-text">+ 250 Free Spins</p>
                        </div>
                        <div class="notification-block">
                            <div class="check-icon notification-icon"></div>
                            <p class="notification-text">
                                Turn on notifications and receive more special
                                bonuses!
                            </p>
                        </div>
                        <div
                            class="button-container light-button install-button-container"
                        >
                            <a href="{offer}" class="button install-button">
                                <div class="button-text-front">
                                    Install the app
                                </div>
                                <div class="button-text-back">
                                    Install the app
                                </div>
                            </a>
                        </div>
                    </div>
                </div>
                <div class="timer-container">
                    <div class="timer-text">Bonus will expire in:</div>
                    <div class="timer-display">
                        <span id="minutes">15</span>
                        <span class="timer-separator">:</span>
                        <span id="seconds">00</span>
                    </div>
                    <div class="timer-labels">
                        <span class="label">minutes</span>
                        <span class="label">seconds</span>
                    </div>
                </div>
            </div>
        </main>

        <script defer src="scripts.min.js"></script>
    </body>
</html>
